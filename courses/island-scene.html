<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>慢慢島・群島地圖</title>
  <link rel="icon" type="image/svg+xml" href="../islands/favicon.svg">
  <link rel="stylesheet" href="../islands/islands.css?v=larger-islands-20261107">
  <link rel="stylesheet" href="island-scene.css?v=larger-islands-20261107">
  <link rel="stylesheet" href="../css/zihi-reading.css?v=20261107a">
  <link rel="stylesheet" href="../islands/map-labels.css?v=compact-labels-2">
  <link rel="stylesheet" href="../islands/map-display.css?v=map-scale-2">
  <script defer src="../js/embedded-messaging.js"></script>
  <script defer src="curriculum-core.js"></script>
  <script defer src="grade1-upper.js?v=rights-review-20261111"></script>
  <script defer src="grade1-upper-draw.js"></script>
  <script defer src="grade1.js"></script>
  <script defer src="grade2.js"></script>
  <script defer src="../grade4/curriculum.js"></script>
  <script defer src="grade5.js"></script>
  <script defer src="grade6.js"></script>
  <script defer src="island-scene-data.js?v=compact-labels-1"></script>
  <script defer src="../islands/vendor/three.min.js"></script>
  <script defer src="../islands/navigation.js?v=semester-map-20261107"></script>
  <script defer src="../islands/sea-life.js"></script>
  <script defer src="../islands/map-camera.js?v=map-scale-2"></script>
  <script defer src="../islands/map-labels.js?v=larger-islands-20261107"></script>
  <script defer src="../islands/pedestrians.js?v=semester-map-20261107"></script>
  <script defer src="../islands/marine-animals.js"></script>
  <script defer src="../js/adventure-art.js?v=plush-home-20261107"></script>
  <script defer src="../islands/world.js?v=plush-home-20261107"></script>
  <script defer src="island-scene.js?v=plush-home-20261107"></script>
  <link rel="stylesheet" href="../css/adventure-art.css?v=plush-home-20261107">
</head>
<body data-view="mission">
  <main class="world-panel course-world" aria-label="木橋群島">
    <div class="traveler-bar">
      <span class="visitor-avatar" aria-hidden="true">♟</span>
      <div><strong id="active-visitor-name">訪客 1</strong><span id="travel-location" role="status">準備出發</span></div>
      <button type="button" id="visitor-edit">訪客名字</button>
      <button type="button" id="visitor-switch">切換訪客</button>
      <label class="island-destination">前往<select id="island-destination"><option value="">選一座島</option></select></label>
    </div>
    <div id="world" aria-label="登島碼頭與木橋相連的數學群島">
      <div class="map-topline"><span class="map-tag" id="map-course-name"></span><span id="view-caption"></span></div>
      <canvas id="ocean" tabindex="0" aria-label="點島名沿橋走；也可用方向鍵行走，跟隨時拖曳旋轉視角"></canvas>

      <div id="traveler-tag" hidden><span>▼</span><b id="traveler-name"></b></div>
      <div id="island-labels"></div>
      <p id="world-status" class="map-status" role="status"></p>
      <div class="compass-rose" aria-hidden="true">N<br>✥</div>
    </div>
    <div class="map-console">
      <div class="map-controls" role="group" aria-label="地圖操作">
        <button type="button" id="landing-label" class="landing-label">⚓ 登島碼頭</button>
        <button type="button" id="overview">全景</button>
        <button type="button" id="zoom-in" aria-label="放大地圖">＋</button>
        <button type="button" id="zoom-out" aria-label="縮小地圖">−</button>

        <button type="button" id="follow-visitor" aria-pressed="false">跟隨訪客</button>
        <button type="button" id="motion-toggle" aria-pressed="false">暫停動態</button>
      </div>
      <div class="camera-controls" role="group" aria-label="看島視角">
        <div><button type="button" data-camera-view="bird" aria-pressed="true">鳥瞰</button><button type="button" data-camera-view="top" aria-pressed="false">俯瞰</button><button type="button" data-camera-view="eye" aria-pressed="false">平視</button></div>
      </div>
      <aside class="resident-dialogue" id="resident-dialogue" hidden aria-labelledby="resident-name">
        <div><span id="resident-icon" aria-hidden="true"></span><strong id="resident-name"></strong><button type="button" id="resident-close" aria-label="關閉居民對話">✕</button></div>
        <p id="resident-line" class="course-hint" role="status"></p>
        <button type="button" id="resident-read">🔈 聽居民說話</button>
      </aside>
      <div class="movement-controls">
        <div class="walk-pad" role="group" aria-label="控制訪客行走">
          <button data-walk="up" aria-label="向前走">↑</button><button data-walk="left" aria-label="向左走">←</button><button id="walk-stop" aria-label="停止行走">停</button><button data-walk="right" aria-label="向右走">→</button><button data-walk="down" aria-label="向後走">↓</button>
        </div>
        <p class="walking-help">點島名或用方向鍵走。跟隨訪客時，可拖曳旋轉視角。</p>
      </div>
    </div>
  </main>
  <dialog id="visitor-dialog" aria-labelledby="visitor-title">
    <form method="dialog">
      <h2 id="visitor-title">訪客名字</h2>
      <label for="visitor-name">輸入名字<input id="visitor-name" maxlength="16" required></label>
      <button type="submit" value="cancel" formnovalidate>取消</button>
      <button type="submit" value="save">儲存</button>
    </form>
  </dialog>
</body>
</html>
